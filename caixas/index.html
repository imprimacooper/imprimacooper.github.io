<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caixa Lab | Gerador para corte a laser</title>
  <style>
    :root{--ink:#17211f;--muted:#68736e;--paper:#f4f1ea;--panel:#fffdf8;--line:#d9d6cd;--accent:#d96b3c;--accent-dark:#9d4124;--green:#315b51}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Georgia,'Times New Roman',serif}header{padding:28px clamp(20px,5vw,72px) 24px;display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent-dark);font:700 11px/1.2 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}h1{margin:8px 0 0;font-size:clamp(28px,4vw,47px);font-weight:500;letter-spacing:-.03em}header p{margin:0;max-width:310px;color:var(--muted);font:14px/1.5 Arial,sans-serif;text-align:right}main{display:grid;grid-template-columns:minmax(290px,370px) 1fr;min-height:calc(100vh - 118px)}aside{padding:30px clamp(20px,4vw,48px);border-right:1px solid var(--line);background:#eeebe3}section{margin-bottom:25px}h2{margin:0 0 13px;font-size:17px;font-weight:500}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:var(--muted);font:12px Arial,sans-serif}input,select{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #c7c6bc;border-radius:2px;color:var(--ink);background:var(--panel);font:15px Georgia,serif}input:focus,select:focus{outline:2px solid #e5a98e;outline-offset:1px}.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.preset{min-height:58px;padding:9px;border:1px solid #c7c6bc;border-radius:2px;background:var(--panel);color:var(--ink);text-align:left;cursor:pointer;font:13px Georgia,serif}.preset:hover,.preset.active{border-color:var(--accent);background:#fff8f0}.preset small{display:block;margin-top:4px;color:var(--muted);font:10px Arial,sans-serif}.swatches{display:flex;gap:8px;margin-top:7px}.swatch{flex:1;padding:8px 4px;border:1px solid #c7c6bc;background:var(--panel);color:var(--ink);cursor:pointer;font:11px Arial,sans-serif}.swatch.selected{outline:2px solid var(--accent);outline-offset:1px}.swatch i{display:block;width:24px;height:24px;margin:0 auto 5px;border:1px solid #aaa}.black i{background:#202322}.white i{background:#fff}.clear i{background:linear-gradient(135deg,#d8f0ecaa,#fff8 48%,#9bc8be88)}.unit{position:relative}.unit input{padding-right:37px}.unit span{position:absolute;right:11px;bottom:10px;color:var(--muted);font:11px Arial,sans-serif}.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px}.check input{width:auto;margin:0}button.primary{width:100%;padding:13px;border:0;border-radius:2px;background:var(--accent);color:white;cursor:pointer;font:700 12px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}button.primary:hover{background:var(--accent-dark)}button.secondary{padding:11px 14px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer;font:700 11px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}.note{margin-top:13px;color:var(--muted);font:11px/1.5 Arial,sans-serif}.workspace{display:grid;grid-template-rows:minmax(390px,1fr) auto;min-width:0}#preview{min-height:390px;position:relative;overflow:hidden;background:radial-gradient(circle at 55% 42%,#fffdf8 0,#f0ece3 68%)}#preview canvas{display:block;width:100%;height:100%}.preview-label{position:absolute;left:25px;top:22px;color:var(--muted);font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}.status{position:absolute;right:25px;bottom:20px;color:var(--muted);font:11px Arial,sans-serif;pointer-events:none}.export-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 25px;border-top:1px solid var(--line);background:var(--panel)}.summary{color:var(--muted);font:12px Arial,sans-serif}.summary strong{color:var(--ink);font-weight:normal}@media(max-width:760px){header{display:block}header p{margin-top:11px;text-align:left}main{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}.workspace{min-height:500px}#preview{min-height:400px}}
  </style>
</head>
<body>
  <header><div><div class="eyebrow">Imprima Cooper / Oficina digital</div><h1>Caixa Lab</h1></div><p>Parametrização de caixas para corte a laser, direto no navegador.</p></header>
  <main><aside>
    <section><h2>Formato</h2><div class="preset-grid"><button class="preset active" data-preset="open">Aberta<small>base + quatro lados</small></button><button class="preset" data-preset="lid">Com tampa<small>tampa encaixada</small></button><button class="preset" data-preset="hinge">Com dobradiça<small>tampa articulada</small></button><button class="preset" data-preset="divider">Divisórias<small>grade interna</small></button></div></section>
    <section><h2>Medidas <span style="font:11px Arial;color:var(--muted)">(mm)</span></h2><div class="field-grid"><label>Largura<div class="unit"><input id="width" type="number" min="10" value="100"><span>mm</span></div></label><label>Profundidade<div class="unit"><input id="depth" type="number" min="10" value="60"><span>mm</span></div></label><label>Altura<div class="unit"><input id="height" type="number" min="10" value="80"><span>mm</span></div></label><label>Espessura<div class="unit"><input id="thickness" type="number" min="1" step="0.1" value="3"><span>mm</span></div></label></div><p class="note">As dimensões informadas são:</p><label class="check"><input type="radio" name="dimension" value="internal" checked> internas</label><label class="check" style="margin-top:8px"><input type="radio" name="dimension" value="external"> externas</label></section>
    <section><h2>Material</h2><label>Cor do acrílico</label><div class="swatches"><button class="swatch black selected" data-color="black"><i></i>Preto</button><button class="swatch white" data-color="white"><i></i>Branco</button><button class="swatch clear" data-color="clear"><i></i>Transparente</button></div></section><button id="generate" class="primary">Atualizar caixa</button><p id="message" class="note" role="status"></p>
  </aside><div class="workspace"><div id="preview"><span class="preview-label">Preview 3D / arraste para orbitar</span><span id="status" class="status"></span></div><div class="export-bar"><div id="summary" class="summary"></div><button id="export" class="secondary">Exportar SVG</button></div></div></main>
  <script src="https://cdn.jsdelivr.net/npm/makerjs@0.15.0/dist/browser.maker.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/OrbitControls.js';
    const makerjs = globalThis.makerjs;
    let scene,camera,renderer,controls,current=null,selectedColor='black',preset='open';const $=id=>document.getElementById(id);const colors={black:{hex:0x222524,stroke:'#111514',opacity:.94},white:{hex:0xf0eee8,stroke:'#62605a',opacity:.96},clear:{hex:0xa9d7d1,stroke:'#43877e',opacity:.48}};
    function init3D(){const host=$('preview');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(35,1,1,2000);camera.position.set(190,150,210);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,30,0);scene.add(new THREE.HemisphereLight(0xfff9ef,0x59635e,2.1));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(120,240,160);scene.add(light);resize();window.addEventListener('resize',resize);animate()}
    function resize(){const host=$('preview'),w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}function clearScene(){while(scene.children.length>2)scene.remove(scene.children[2])}function panel(w,h,d,material,position,rotation){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(...position);if(rotation)mesh.rotation.set(...rotation);scene.add(mesh)}
    function generateBox(){const w=+$('width').value,h=+$('height').value,d=+$('depth').value,t=+$('thickness').value;if([w,h,d,t].some(value=>!Number.isFinite(value)||value<=0)){$('message').textContent='Informe medidas positivas.';return}const internal=document.querySelector('input[name="dimension"]:checked').value==='internal';const outer={w:internal?w+2*t:w,h:internal?h+2*t:h,d:internal?d+2*t:d};current={...outer,t,preset};clearScene();const c=colors[selectedColor],mat=new THREE.MeshStandardMaterial({color:c.hex,roughness:.32,metalness:.05,transparent:c.opacity<1,opacity:c.opacity,side:THREE.DoubleSide});panel(outer.w,t,outer.d,mat,[0,t/2,0]);panel(outer.w,outer.h,t,mat,[0,outer.h/2,outer.d/2-t/2]);panel(outer.w,outer.h,t,mat,[0,outer.h/2,-outer.d/2+t/2]);panel(t,outer.h,outer.d-2*t,mat,[-outer.w/2+t/2,outer.h/2,0]);panel(t,outer.h,outer.d-2*t,mat,[outer.w/2-t/2,outer.h/2,0]);if(preset==='lid'||preset==='hinge')panel(outer.w,t,outer.d,mat,[0,outer.h+t/2,0]);if(preset==='divider'){panel(outer.w-2*t,outer.h*.7,t/2,mat,[0,outer.h*.36,0]);panel(t/2,outer.h*.7,outer.d-2*t,mat,[0,outer.h*.36,0],[0,Math.PI/2,0])}camera.position.set(Math.max(150,outer.w*1.8),Math.max(130,outer.h*1.7),Math.max(180,outer.d*2));controls.target.set(0,outer.h/2,0);controls.update();$('summary').innerHTML='<strong>'+Math.round(outer.w)+' × '+Math.round(outer.d)+' × '+Math.round(outer.h)+' mm</strong> · '+pieceCount()+' peças · '+selectedColor;$('status').textContent='modelo atualizado';$('message').textContent='Dimensões externas calculadas com a espessura selecionada.'}
    function pieceCount(){return preset==='divider'?7:(preset==='open'?5:6)}function addRect(model,name,x,y,w,h,t,edge){const rect=new makerjs.models.Rectangle(w,h);makerjs.model.move(rect,[x,y]);model.models[name]=rect;addFingerJoints(model,x,y,w,h,t,edge)}function addFingerJoints(model,x,y,w,h,t,edge){const count=Math.max(2,Math.floor((edge||w)/(t*5)));const step=(edge||w)/count;for(let i=1;i<count;i+=2){const a=makerjs.model.move(new makerjs.models.Rectangle(Math.min(t,step*.35),t),[x+i*step-t/2,y+h-t]);model.models['joint_'+x+'_'+i]=a}}
    function exportSVG(){if(!current)generateBox();if(!current||!window.makerjs)return;const{w,h,d,t}=current,model={models:{}},y=0;addRect(model,'base',0,y,w,d,t,w);addRect(model,'front',0,d+t*3,w,h,t,w);addRect(model,'back',w+t*3,d+t*3,w,h,t,w);addRect(model,'left',w*2+t*6,d+t*3,d,h,t,h);addRect(model,'right',w*2+d+t*9,d+t*3,d,h,t,h);if(preset!=='open')addRect(model,'lid',0,d+h+t*6,w,d,t,w);if(preset==='divider')addRect(model,'divider',w*2+d+t*12,d+t*3,w-2*t,d-2*t,t,w);const svg=makerjs.exporter.toSVG(model,{stroke:'none',fill:'none'}).replace(/<svg /,'<svg id="caixa-laser" '),blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='caixa-'+preset+'.svg';a.click();URL.revokeObjectURL(url);$('message').textContent='SVG planificado exportado com encaixes.'}
    document.querySelectorAll('.preset').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.preset').forEach(item=>item.classList.remove('active'));button.classList.add('active');preset=button.dataset.preset;generateBox()}));document.querySelectorAll('.swatch').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.swatch').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');selectedColor=button.dataset.color;generateBox()}));$('generate').addEventListener('click',generateBox);$('export').addEventListener('click',exportSVG);document.querySelectorAll('input').forEach(input=>input.addEventListener('change',generateBox));init3D();generateBox();
  </script>
</body>
</html>
