<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#272723">
  <title>Gerador de Caixas ImprimaCooper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../logo.svg" alt="ImprimaCooper">
      <span class="brand-divider" aria-hidden="true"></span>
      <h1>Gerador de Caixas</h1>
    </div>
    <p>Parametrização de caixas para corte a laser, direto no navegador.</p>
  </header>

  <main class="app">
    <aside class="sidebar">
      <section class="sidebar-section">
        <div class="eyebrow">Projeto</div>
        <h2>Formato</h2>
        <div class="preset-grid">
          <button class="preset active" data-preset="open">Aberta<small>base + quatro lados</small></button>
          <button class="preset" data-preset="lid">Com tampa<small>tampa encaixada</small></button>
          <button class="preset" data-preset="hinge">Com dobradiça<small>tampa articulada</small></button>
          <button class="preset" data-preset="divider">Divisórias<small>grade interna</small></button>
        </div>
      </section>

      <section class="sidebar-section">
        <div class="eyebrow">Dimensões</div>
        <h2>Medidas <span class="note">(mm)</span></h2>
        <div class="field-grid">
          <label>Largura<div class="unit"><input id="width" type="number" min="10" value="100"><span>mm</span></div></label>
          <label>Profundidade<div class="unit"><input id="depth" type="number" min="10" value="60"><span>mm</span></div></label>
          <label>Altura<div class="unit"><input id="height" type="number" min="10" value="80"><span>mm</span></div></label>
          <label>Espessura<div class="unit"><input id="thickness" type="number" min="1" step="0.1" value="3"><span>mm</span></div></label>
        </div>
        <p class="note">As dimensões informadas são:</p>
        <label class="dimension-option"><input type="radio" name="dimension" value="internal" checked> internas</label>
        <label class="dimension-option"><input type="radio" name="dimension" value="external"> externas</label>
      </section>

      <section class="sidebar-section">
        <div class="eyebrow">Material</div>
        <h2>Cor do acrílico</h2>
        <div class="swatches">
          <button class="swatch black selected" data-color="black"><i></i>Preto</button>
          <button class="swatch white" data-color="white"><i></i>Branco</button>
          <button class="swatch clear" data-color="clear"><i></i>Transparente</button>
        </div>
      </section>

      <button id="generate" class="primary">Atualizar caixa</button>
      <p id="message" class="note" role="status"></p>
    </aside>

    <div class="workspace">
      <div id="preview" class="preview">
        <span class="preview-label">Preview 3D / arraste para orbitar</span>
        <span id="status" class="status"></span>
      </div>
      <div class="export-bar">
        <div id="summary" class="summary"></div>
        <button id="export" class="secondary">Exportar SVG</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/makerjs@0.15.0/dist/browser.maker.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"}}</script>
  <script type="module" src="script.js"></script>
</body>
</html>
